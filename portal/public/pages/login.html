<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Acceso clientes · Pandora Comunicación</title>
  <link rel="icon" href="/portal-assets/img/favicon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="/portal-assets/css/tokens.css">
  <link rel="stylesheet" href="/portal-assets/css/portal.css">
</head>
<body>
  <div class="lg">
    <svg class="lg__mark" viewBox="0 0 188 188" aria-hidden="true" focusable="false"><circle class="mk-disc" cx="94" cy="94" r="93"></circle><polygon class="mk-stem" points="62,42 117,42 92,142 62,142"></polygon><circle class="mk-dot" cx="108.5" cy="83.5" r="32.5"></circle></svg>

    <header class="lg__bar">
      <a href="/" class="lg__logo" aria-label="Pandora Comunicación, inicio"><img src="/portal-assets/img/pandora-logo.png" alt="Pandora Comunicación" width="1024" height="188"></a>
      <a href="/" class="lg__back">Volver a pandorapr.com.ar</a>
    </header>

    <main class="lg__main">
      <div>
        <p class="lg__eyebrow">Espacio de clientes</p>
        <h1 class="lg__title">Monitoreo de inteligencia comunicacional</h1>
        <p class="lg__lead">Ingresá con las credenciales que te asignamos para acceder a los reportes de tu organización.</p>
      </div>

      <form class="lg__panel" id="login-form" novalidate>
        <fieldset class="seg">
          <legend class="sr-only">Tipo de acceso</legend>
          <label><input type="radio" name="role" value="cliente" checked><span>Cliente</span></label>
          <label><input type="radio" name="role" value="admin"><span>Administrador</span></label>
        </fieldset>

        <div class="field">
          <label for="username" id="username-label">Usuario de cliente</label>
          <input type="text" id="username" name="username" autocomplete="username" autocapitalize="none" spellcheck="false" required>
        </div>
        <div class="field">
          <label for="password">Contraseña</label>
          <input type="password" id="password" name="password" autocomplete="current-password" required>
        </div>

        <p class="lg__error" id="login-error" role="alert" hidden></p>

        <button type="submit" class="btn btn--block">Ingresar</button>

        <p class="lg__hint" id="login-hint">Acceso de solo lectura al portal de SBASE.</p>
      </form>
    </main>
  </div>

  <script src="/portal-assets/js/login.js"></script>
</body>
</html>
